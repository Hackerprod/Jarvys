<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Offline Notes</title>
  <link rel="stylesheet" href="style.css">
  <script src="/factory-sdk.js"></script>
  <script src="app.js" defer></script>
</head>
<body>
  <main>
    <header><p class="eyebrow">MADE WITH JARVYS</p><h1>Offline Notes</h1><p>Your ideas, saved on this device.</p></header>
    <section aria-label="Saved notes"><div class="row"><h2>Your notes</h2><button id="new" type="button">New note</button></div><ul id="notes"></ul></section>
    <section aria-label="Note editor">
      <label for="title">Title</label><input id="title" maxlength="60" placeholder="A new idea">
      <label for="body">Note</label><textarea id="body" rows="9" maxlength="600" placeholder="Write something worth keeping…"></textarea>
      <div class="row actions"><button id="save" type="button">Save note</button><button id="export" type="button" class="secondary">Export .txt</button><button id="delete" type="button" class="secondary">Delete</button></div>
      <p id="status" role="status" aria-live="polite">Loading saved notes…</p>
    </section>
    <footer>Private app storage · No account · No network</footer>
  </main>
</body>
</html>
