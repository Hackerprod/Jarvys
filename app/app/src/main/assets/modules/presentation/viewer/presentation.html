<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Presentación</title>
  <style>
    :root { color-scheme: light dark; font-family: sans-serif; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100vh; min-width: 0; min-height: 100vh; margin: 0; overflow: hidden; }
    body { display: grid; grid-template-rows: minmax(0, 1fr) auto auto; background: #111827; color: #f9fafb; }
    .stage { display: grid; place-items: center; min-width: 0; min-height: 0; padding: 12px; background: #182230; }
    .loading { margin: 0; color: inherit; text-align: center; font-size: 14px; line-height: 1.4; }
    .slide-image { display: block; max-width: 100%; max-height: 100%; background: #fff; box-shadow: 0 18px 55px #0008; }
    #status { min-width: 0; margin: 0; padding: 10px 12px; text-align: center; font-size: 14px; line-height: 1.4; overflow-wrap: anywhere; background: #7f1d1d; color: #fff; }
    nav { display: flex; justify-content: center; align-items: center; gap: 8px; min-width: 0; padding: 8px 12px max(8px, env(safe-area-inset-bottom)); }
    button { flex: 0 0 auto; min-width: 0; min-height: 44px; padding: 8px 12px; border: 1px solid #98a2b3; border-radius: 10px; background: #24324a; color: #fff; font: inherit; font-size: 14px; white-space: nowrap; }
    button:disabled { opacity: .55; }
    #counter { flex: 1 1 auto; min-width: 0; text-align: center; font-size: 14px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
    @media (prefers-color-scheme: light) {
      body { background: #fff; color: #101828; }
      .stage { background: #f2f4f7; }
      #status { background: #fee4e2; color: #b42318; border-top: 1px solid #fecdca; }
      button { background: #fff; color: #24324a; border-color: #667085; }
    }
  </style>
  <script>
    (function () {
      "use strict";

      var ready = false;
      var failureShown = false;
      // API 34 WebView measurements were 431 ms, 749 ms, and 1284 ms; report only after over 7x the slowest.
      var timer = window.setTimeout(function () {
        if (!ready) showFailure();
      }, 10000);

      function sizeViewport() {
        var height = window.innerHeight;
        if (!height || !document.body) return;
        document.documentElement.style.height = height + "px";
        document.documentElement.style.minHeight = height + "px";
        document.body.style.height = height + "px";
        document.body.style.minHeight = height + "px";
      }

      function showFailure() {
        if (failureShown) return;
        var status = document.getElementById("status");
        if (!status) return;
        failureShown = true;
        window.clearTimeout(timer);
        var isSpanish = (navigator.language || "en").toLowerCase().indexOf("es") === 0;
        status.textContent = status.getAttribute(isSpanish ? "data-error-es" : "data-error-en");
        status.hidden = false;
        var counter = document.getElementById("counter");
        if (counter) counter.textContent = "";
      }

      window.__presentationViewerReady = function () {
        ready = true;
        window.clearTimeout(timer);
      };

      window.addEventListener("DOMContentLoaded", sizeViewport);
      window.addEventListener("resize", sizeViewport);
      window.addEventListener("error", function (event) {
        var target = event.target;
        if (target && target !== window) {
          if (target.tagName !== "SCRIPT" || target.getAttribute("src") !== "presentation.js") return;
        }
        showFailure();
      }, true);
      window.addEventListener("unhandledrejection", showFailure);
    }());
  </script>
</head>
<body>
  <main class="stage" id="stage" aria-label="Diapositiva de la presentación">
    <p class="loading" id="loading">Cargando presentación…</p>
  </main>
  <p id="status" role="alert"
     data-error-es="No se pudo abrir la presentación. Vuelve a intentarlo o abre el archivo en una aplicación compatible."
     data-error-en="The presentation could not be opened. Try again or open the file in a compatible app."
     hidden></p>
  <nav id="navigation" aria-label="Controles de diapositivas">
    <button id="previous" type="button" disabled>Anterior</button>
    <span id="counter" aria-live="polite">Cargando…</span>
    <button id="next" type="button" disabled>Siguiente</button>
  </nav>
  <script src="presentation.js"></script>
</body>
</html>
