<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Presentación</title>
  <style>
    :root { color-scheme: light dark; font-family: sans-serif; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body { display: grid; grid-template-rows: minmax(0, 1fr) auto; background: #111827; color: #f9fafb; }
    .stage { display: grid; place-items: center; min-height: 0; padding: 16px; }
    canvas { display: block; width: min(100%, 1440px); max-height: 100%; aspect-ratio: 16 / 9; background: #fff; box-shadow: 0 18px 55px #0008; }
    nav { display: flex; justify-content: center; align-items: center; gap: 18px; padding: 12px 16px max(12px, env(safe-area-inset-bottom)); }
    button { min-width: 92px; min-height: 44px; border: 1px solid #667085; border-radius: 10px; background: #24324a; color: #fff; font: inherit; }
    button:disabled { opacity: .45; }
    #counter { min-width: 112px; text-align: center; font-variant-numeric: tabular-nums; }
    #status { position: absolute; top: 16px; left: 16px; color: #fecaca; }
  </style>
</head>
<body>
  <div class="stage"><canvas id="slide" role="img" aria-label="Diapositiva de la presentación"></canvas></div>
  <p id="status" role="status" hidden></p>
  <nav aria-label="Controles de diapositivas">
    <button id="previous" type="button">Anterior</button>
    <span id="counter" aria-live="polite">Cargando</span>
    <button id="next" type="button">Siguiente</button>
  </nav>
  <script src="../vendor/jszip.min.js"></script>
  <script src="deck-renderer.js"></script>
  <script src="presentation.js"></script>
</body>
</html>
