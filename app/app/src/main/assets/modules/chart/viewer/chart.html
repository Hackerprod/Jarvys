<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gráfica</title>
  <style>
    :root { color-scheme: light dark; font-family: sans-serif; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: Canvas; color: CanvasText; padding: 20px; }
    main { width: min(100%, 1200px); height: min(100%, 760px); display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 16px; }
    h1 { margin: 0; font-size: clamp(1.15rem, 3vw, 1.8rem); font-weight: 600; }
    .plot { min-height: 0; padding: 16px; border: 1px solid color-mix(in srgb, CanvasText 16%, transparent); border-radius: 16px; background: Canvas; }
    canvas { display: block; width: 100% !important; height: 100% !important; }
    .status { padding: 16px; color: #a33; }
  </style>
</head>
<body>
  <main>
    <h1 id="title">Gráfica</h1>
    <section class="plot"><canvas id="chart" aria-label="Gráfica" role="img"></canvas></section>
  </main>
  <script src="../vendor/chart.umd.min.js"></script>
  <script src="chart.js"></script>
</body>
</html>
