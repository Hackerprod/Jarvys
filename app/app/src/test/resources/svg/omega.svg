<svg viewBox="0 0 432 768" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Diagrama de OMEGA Runtime con control experimental, instrumentación y acceso al hardware físico mediante Linux mínimo" style="color:#f2f2f2">
