<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob:; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'; worker-src 'none'; child-src 'none'">
  <title>PPTX viewer evaluation</title>
  <style>
    :root { color-scheme: light dark; font-family: Arial, sans-serif; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { display: grid; grid-template-rows: minmax(0, 1fr) auto auto; background: #111827; color: #f9fafb; }
    #stage { display: grid; place-items: center; min-width: 0; min-height: 0; padding: 12px; }
    canvas, #stage img { display: block; width: auto; height: auto; max-width: 100%; max-height: 100%; background: white; box-shadow: 0 18px 55px #0008; }
    #warning, #failure, #result { min-width: 0; margin: 0; padding: 8px 12px; text-align: center; font-size: 13px; line-height: 1.35; overflow-wrap: anywhere; }
    #warning { background: #344054; color: white; }
    #failure { background: #7f1d1d; color: white; }
    nav { display: flex; justify-content: center; align-items: center; gap: 8px; min-width: 0; padding: 8px 12px; }
    button { min-width: 0; min-height: 44px; padding: 8px 10px; border: 1px solid #667085; border-radius: 10px; background: #24324a; color: white; font: inherit; font-size: 14px; }
    button:disabled { opacity: .55; }
    #counter { flex: 1; text-align: center; font-size: 14px; }
    #result { position: absolute; left: -10000px; }
    @media (prefers-color-scheme: light) { body { background: #f2f4f7; color: #101828; } button { background: white; color: #24324a; } }
  </style>
  <script src="/assets/vendor/jszip.min.js"></script>
  <script src="/candidate-assets/chartjs/chart.umd.min.js"></script>
  <script src="/candidates/pptxviewjs/package/dist/PptxViewJS.min.js"></script>
  <script src="/assets/viewer/deck-renderer.js"></script>
</head>
<body>
  <div id="stage"><canvas id="slide" role="img" aria-label="Diapositiva de evaluación"></canvas></div>
  <p id="warning" hidden></p>
  <p id="failure" hidden></p>
  <output id="result"></output>
  <nav aria-label="Controles de evaluación">
    <button id="previous" type="button" disabled>Anterior</button>
    <span id="counter" aria-live="polite">Cargando</span>
    <button id="next" type="button" disabled>Siguiente</button>
  </nav>
  <script>
    (function () {
      "use strict";
      var query = new URLSearchParams(location.search);
      var rendererName = query.get("renderer") || "pptxviewjs";
      var fixture = query.get("fixture") || "title-text";
      var requestedSlide = Number(query.get("slide") || 0);
      var captureName = query.get("capture") || "";
      var canvas = document.getElementById("slide");
      var stage = document.getElementById("stage");
      var counter = document.getElementById("counter");
      var previous = document.getElementById("previous");
      var next = document.getElementById("next");
      var warning = document.getElementById("warning");
      var failure = document.getElementById("failure");
      var result = document.getElementById("result");
      var currentSlide = 0;
      var slideCount = 0;
      var renderer;
      var deck;
      var svgSlides = [];
      var candidateWarnings = [];
      var started = performance.now();
      var originalConsole = { warn: console.warn, error: console.error };

      function issue(level, values) {
        var message = Array.prototype.map.call(values, String).join(" ");
        candidateWarnings.push(level + ": " + message);
        warning.hidden = false;
        warning.textContent = "Aviso del renderizador: " + message;
        originalConsole[level].apply(console, values);
      }
      console.warn = function () { issue("warn", arguments); };
      console.error = function () { issue("error", arguments); };
      window.addEventListener("error", function (event) { candidateWarnings.push("error: " + event.message); });
      window.addEventListener("unhandledrejection", function (event) { candidateWarnings.push("rejection: " + String(event.reason)); });

      function updateControls() {
        counter.textContent = "Diapositiva " + (currentSlide + 1) + " de " + slideCount;
        previous.disabled = currentSlide === 0;
        next.disabled = currentSlide === slideCount - 1;
      }

      function fitImage(svg) {
        return new Promise(function (resolve, reject) {
          var image = new Image();
          var url = URL.createObjectURL(new Blob([svg], { type: "image/svg+xml" }));
          image.alt = "Render de " + fixture;
          image.onload = function () { URL.revokeObjectURL(url); resolve(); };
          image.onerror = function () { URL.revokeObjectURL(url); reject(new Error("Rendered SVG could not be displayed.")); };
          image.src = url;
          stage.replaceChildren(image);
        });
      }

      async function loadScript(source) {
        return new Promise(function (resolve, reject) {
          var script = document.createElement("script");
          script.src = source;
          script.onload = resolve;
          script.onerror = function () { reject(new Error("Could not load local candidate script: " + source)); };
          document.head.appendChild(script);
        });
      }

      async function prepare(bytes) {
        if (rendererName === "pptxviewjs") {
          renderer = new PptxViewJS.PPTXViewer({ canvas: canvas, slideSizeMode: "fit", enableThumbnails: false, debug: false });
          await renderer.loadFile(bytes);
          slideCount = renderer.getSlideCount();
        } else if (rendererName === "deck-renderer") {
          deck = await PptxDeckRenderer.loadDeck(bytes);
          slideCount = deck.slidePaths.length;
          var unsupported = await PptxDeckRenderer.renderSlide(deck, 0, canvas);
          if (unsupported.presentationWarnings.length) {
            warning.hidden = false;
            warning.textContent = unsupported.presentationWarnings.join(" ");
          }
        } else if (rendererName === "pptx-preview") {
          await loadScript("/candidates/preview/package/dist/pptx-preview.umd.js");
          renderer = pptxPreview.init(stage, { width: 336, height: 189 });
          await renderer.preview(bytes.buffer.slice(bytes.byteOffset, bytes.byteOffset + bytes.byteLength));
          slideCount = renderer.slideCount;
        } else if (rendererName === "pptx-glimpse") {
          var glimpse = await import("/candidates/glimpse/package/dist/browser.js");
          var report = await glimpse.convertPptxToSvg(bytes, { textOutput: "text", width: 1280 });
          svgSlides = report.slides.map(function (slide) { return slide.svg; });
          slideCount = svgSlides.length;
          result.dataset.supportCoverage = JSON.stringify(report.supportCoverage || {});
          result.dataset.diagnostics = JSON.stringify(report.diagnostics || []);
        } else if (rendererName === "silurus") {
          var silurus = await import("/candidates/silurus/package/dist/pptx.mjs");
          renderer = new silurus.PptxViewer(canvas, { mode: "main" });
          await renderer.load(bytes.buffer.slice(bytes.byteOffset, bytes.byteOffset + bytes.byteLength));
          slideCount = renderer.slideCount || 1;
        } else {
          throw new Error("Unknown renderer: " + rendererName);
        }
      }

      async function showSlide(index) {
        if (rendererName === "pptxviewjs") await renderer.goToSlide(index, canvas);
        else if (rendererName === "deck-renderer") await PptxDeckRenderer.renderSlide(deck, index, canvas);
        else if (rendererName === "pptx-preview") renderer.renderSingleSlide(index);
        else if (rendererName === "pptx-glimpse") await fitImage(svgSlides[index]);
        else if (rendererName === "silurus") await renderer.goToSlide(index);
        currentSlide = index;
        updateControls();
      }

      previous.addEventListener("click", function () { if (currentSlide > 0) showSlide(currentSlide - 1).catch(fail); });
      next.addEventListener("click", function () { if (currentSlide < slideCount - 1) showSlide(currentSlide + 1).catch(fail); });

      function fail(error) {
        failure.hidden = false;
        failure.textContent = error && error.message ? error.message : String(error);
        document.body.dataset.status = "error";
        finish(error);
      }
      function finish(error) {
        var renderedElement = rendererName === "pptx-preview" ? stage.firstElementChild :
          rendererName === "pptx-glimpse" ? stage.querySelector("img") : canvas;
        var renderedRect = renderedElement ? renderedElement.getBoundingClientRect() : null;
        var stageRect = stage.getBoundingClientRect();
        result.textContent = JSON.stringify({
          renderer: rendererName,
          fixture: fixture,
          slideIndex: currentSlide,
          capture: captureName,
          status: error ? "error" : "ok",
          message: error ? String(error.message || error) : "",
          renderMs: Number((performance.now() - started).toFixed(1)),
          slideCount: slideCount,
          viewport: {
            innerWidth: window.innerWidth,
            innerHeight: window.innerHeight,
            devicePixelRatio: window.devicePixelRatio,
            visualWidth: window.visualViewport ? Number(window.visualViewport.width.toFixed(1)) : null,
            visualHeight: window.visualViewport ? Number(window.visualViewport.height.toFixed(1)) : null
          },
          bounds: renderedRect ? {
            left: Number(renderedRect.left.toFixed(1)),
            right: Number(renderedRect.right.toFixed(1)),
            width: Number(renderedRect.width.toFixed(1)),
            height: Number(renderedRect.height.toFixed(1)),
            stageWidth: Number(stageRect.width.toFixed(1)),
            stageHeight: Number(stageRect.height.toFixed(1))
          } : null,
          warnings: candidateWarnings
        });
        document.body.dataset.status = error ? "error" : "ok";
        document.body.dataset.ready = "true";
        window.evalReportPromise = fetch("/report", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: result.textContent
        });
      }

      window.evalReady = (async function () {
        try {
          var response = await fetch("/fixtures/" + fixture + ".pptx");
          if (!response.ok) throw new Error("Fixture request returned " + response.status);
          var bytes = new Uint8Array(await response.arrayBuffer());
          await prepare(bytes);
          if (requestedSlide < 0 || requestedSlide >= slideCount) throw new Error("Requested slide is outside this fixture.");
          await showSlide(requestedSlide);
          finish(null);
        } catch (error) { fail(error); }
      }());
    }());
  </script>
</body>
</html>
