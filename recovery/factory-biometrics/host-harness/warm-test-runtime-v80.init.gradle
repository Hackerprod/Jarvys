// Resolve actual AGP Test classpaths without running any Test JVM or changing dependencies.
gradle.projectsEvaluated {
    rootProject.tasks.register('restoreHostTestRuntimeCache') {
        doLast {
            [':app': ['testFullDebugUnitTest', 'testPlayDebugUnitTest'],
             ':apk-runtime': ['testDebugUnitTest','testReleaseUnitTest'],
             ':factory-runtime-core': ['testDebugUnitTest','testReleaseUnitTest']].each { projectPath, names ->
                names.each { name ->
                    def task = rootProject.project(projectPath).tasks.named(name).get()
                    if (!(task instanceof Test)) throw new GradleException('Expected Test classpath')
                    logger.lifecycle("PREWARMED_EXISTING_TEST_CLASSPATH ${task.path} files=${task.classpath.files.size()}")
                }
            }
        }
    }
}
