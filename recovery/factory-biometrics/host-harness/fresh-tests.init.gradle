// Recovery-only host harness. Not an app/repository dependency.
def rootPath = System.getenv('JARVYS_VALIDATION_ROOT')
if (!rootPath || !new File(rootPath).isAbsolute())
    throw new GradleException('JARVYS_VALIDATION_ROOT must be an absolute external evidence directory')
def evidenceRoot = new File(rootPath).canonicalFile
if (!evidenceRoot.isDirectory()) throw new GradleException('Evidence root must already exist')
def guardJar = new File(evidenceRoot, 'offline-guard/jarvys-offline-guard.jar')
def runLabel = System.getenv('JARVYS_RUN_LABEL') ?: 'unset'
if (runLabel == 'unset' || !(runLabel ==~ /[A-Za-z0-9][A-Za-z0-9._-]{0,127}/))
    throw new GradleException('A fresh safe JARVYS_RUN_LABEL is required')
allprojects {
    tasks.withType(Test).configureEach { t ->
        if (runLabel == 'unset') throw new GradleException('JARVYS_RUN_LABEL is required for fresh test evidence')
        outputs.upToDateWhen { false }
        maxHeapSize = '1280m'
        maxParallelForks = 1
        forkEvery = 60
        def taskRoot = new File(evidenceRoot, "runs/${runLabel}/${project.name}-${name}")
        systemProperty 'java.io.tmpdir', new File(taskRoot, 'tmp').absolutePath
        systemProperty 'user.home', new File(taskRoot, 'home').absolutePath
        systemProperty 'jarvys.offlineGuard.reportDir', new File(taskRoot, 'guard').absolutePath
        systemProperty 'robolectric.offline', 'true'
        systemProperty 'robolectric.dependency.dir', new File(evidenceRoot, 'robolectric-sdks').absolutePath
        systemProperty 'javax.net.ssl.trustStore', '/etc/ssl/certs/java/cacerts'
        jvmArgs "-javaagent:${guardJar.absolutePath}", '-XX:-CreateCoredumpOnCrash'
        doFirst {
            if (!(gradle.startParameter.logLevel in [org.gradle.api.logging.LogLevel.INFO, org.gradle.api.logging.LogLevel.DEBUG]))
                throw new GradleException('Host Test execution requires --info worker-launch evidence')
            if (!gradle.startParameter.offline)
                throw new GradleException('Actual host Test execution requires --offline; warm dependencies separately')
            def effectiveAgents = allJvmArgs.findAll { it.startsWith('-javaagent:') }
            if (!effectiveAgents || effectiveAgents[0] != "-javaagent:${guardJar.absolutePath}")
                throw new GradleException('Reviewed guard must be the first actual Test JVM javaagent')
            def expectedGuardHashes = [
                'jarvys-offline-guard.jar': '9224f15d36536ecaf14be6aaaba81650e52587b15a786762a4688e1d3a8bed9f',
                'guard-bootstrap.jar': '2b29e6ab92e06f4337047d4c8c35499030c252829d795e9f322a7058df8540e6'
            ]
            expectedGuardHashes.each { filename, expected ->
                def artifact = new File(guardJar.parentFile, filename)
                if (!artifact.isFile()) throw new GradleException('Reviewed host guard artifact is missing')
                def digest = java.security.MessageDigest.getInstance('SHA-256').digest(artifact.bytes).encodeHex().toString()
                if (digest != expected) throw new GradleException('Reviewed host guard artifact hash mismatch')
            }
            if (taskRoot.exists()) throw new GradleException('Refusing reused test evidence directory: ' + taskRoot)
            ['tmp','home','guard'].each { new File(taskRoot,it).mkdirs() }
            logger.lifecycle("FRESH_GUARDED_TEST_TASK ${path} run=${runLabel}")
        }
    }
}
